<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Black-Mata v1 — Acceptance Test</title>
<style>
  :root {
    --bg:       #0d1117;
    --surface:  #161b22;
    --surface2: #1e242d;
    --border:   #30363d;
    --text:     #e6edf3;
    --muted:    #8b949e;
    --accent:   #58a6ff;
    --green:    #3fb950;
    --red:      #f85149;
    --yellow:   #d29922;
    --orange:   #ffa657;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
    font-size: 14px; line-height: 1.6;
  }

  /* ── header ── */
  header {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 16px 24px; position: sticky; top: 0; z-index: 100;
    display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
  }
  header h1 { font-size: 16px; font-weight: 700; color: #fff; white-space: nowrap; }
  .header-meta { font-size: 12px; color: var(--muted); }

  .overall-bar-wrap {
    flex: 1; min-width: 180px;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 6px; height: 18px; overflow: hidden; position: relative;
  }
  .overall-bar {
    height: 100%; width: 0; background: var(--green);
    transition: width 0.3s ease;
  }
  .overall-pct {
    position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; font-size: 11px; font-weight: 700; color: #fff;
  }

  .btn-hdr {
    font-size: 12px; font-weight: 600; padding: 5px 12px; border-radius: 5px;
    cursor: pointer; border: 1px solid var(--border); background: var(--surface2);
    color: var(--text); white-space: nowrap;
  }
  .btn-hdr:hover { border-color: var(--accent); color: var(--accent); }
  .btn-hdr.danger:hover { border-color: var(--red); color: var(--red); }

  /* ── main layout ── */
  main { max-width: 860px; margin: 0 auto; padding: 24px 20px 80px; }

  /* ── section card ── */
  .section {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; margin-bottom: 14px; overflow: hidden;
  }
  .section-header {
    display: flex; align-items: center; gap: 12px;
    padding: 13px 18px; cursor: pointer; user-select: none;
    border-bottom: 1px solid transparent;
    transition: background 0.15s;
  }
  .section-header:hover { background: #ffffff08; }
  .section.open .section-header { border-bottom-color: var(--border); }

  .sec-num {
    font-size: 10px; font-weight: 700; letter-spacing: 0.1em;
    color: var(--muted); background: var(--bg);
    padding: 2px 8px; border-radius: 4px; border: 1px solid var(--border);
    white-space: nowrap;
  }
  .sec-title { font-size: 14px; font-weight: 600; color: var(--text); flex: 1; }
  .sec-progress {
    font-size: 11px; color: var(--muted); white-space: nowrap;
  }
  .sec-status {
    font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 4px;
    white-space: nowrap;
  }
  .sec-status.todo    { background: #1e242d; color: var(--muted); border: 1px solid var(--border); }
  .sec-status.partial { background: #3a2f1f; color: var(--orange); border: 1px solid #5a4a2a; }
  .sec-status.pass    { background: #1f3a2f; color: var(--green);  border: 1px solid #2a5a3a; }
  .sec-status.fail    { background: #3a1f1f; color: var(--red);    border: 1px solid #5a2a2a; }
  .sec-chevron { color: var(--muted); font-size: 11px; transition: transform 0.2s; }
  .section.open .sec-chevron { transform: rotate(90deg); }

  /* ── section progress bar ── */
  .sec-bar-wrap {
    height: 3px; background: var(--bg);
  }
  .sec-bar { height: 100%; width: 0; background: var(--green); transition: width 0.3s ease; }

  /* ── items ── */
  .section-body { padding: 12px 18px 16px; display: none; }
  .section.open .section-body { display: block; }

  .item {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 5px 0; border-bottom: 1px solid #1a1f26;
  }
  .item:last-child { border-bottom: none; }

  .item input[type="checkbox"] {
    margin-top: 3px; width: 15px; height: 15px; flex-shrink: 0;
    accent-color: var(--green); cursor: pointer;
  }
  .item label {
    font-size: 13px; color: var(--text); cursor: pointer; flex: 1;
    line-height: 1.5;
  }
  .item.checked label { color: var(--muted); text-decoration: line-through; }

  .item label code {
    font-family: 'SFMono-Regular', 'Consolas', monospace;
    font-size: 12px; background: var(--bg);
    padding: 1px 5px; border-radius: 3px; color: var(--accent);
  }
  .item label .warn { color: var(--yellow); font-style: italic; font-size: 12px; }

  .sub-note {
    font-size: 12px; color: var(--muted); margin: 6px 0 10px 25px;
    padding: 6px 10px; border-left: 2px solid var(--border);
    border-radius: 0 4px 4px 0; background: var(--surface2);
  }
  .sub-note code { font-family: monospace; font-size: 11px; color: var(--orange); }

  /* ── sign-off ── */
  .signoff {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 20px 22px; margin-top: 24px;
  }
  .signoff h2 { font-size: 15px; font-weight: 700; color: #fff; margin-bottom: 14px; }
  .signoff-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
    margin-bottom: 18px;
  }
  .signoff-row {
    display: flex; align-items: center; gap: 8px; font-size: 12px;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 6px; padding: 7px 12px;
  }
  .signoff-row .dot {
    width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
    background: var(--muted);
  }
  .signoff-row.pass .dot  { background: var(--green); }
  .signoff-row.fail .dot  { background: var(--red); }
  .signoff-row .sec-lbl   { flex: 1; }
  .signoff-row .sec-badge { font-size: 11px; font-weight: 700; }
  .signoff-row.pass .sec-badge { color: var(--green); }
  .signoff-row.fail .sec-badge { color: var(--red); }
  .signoff-row.todo .sec-badge { color: var(--muted); }

  .field-row {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 8px; font-size: 13px;
  }
  .field-row label { width: 180px; color: var(--muted); flex-shrink: 0; }
  .field-row input {
    flex: 1; background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); padding: 5px 10px; border-radius: 5px;
    font-family: monospace; font-size: 12px;
  }
  .field-row input:focus { outline: none; border-color: var(--accent); }

  .verdict {
    display: flex; gap: 12px; margin-top: 14px; flex-wrap: wrap;
  }
  .verdict-btn {
    flex: 1; min-width: 160px; padding: 12px; border-radius: 7px;
    border: 2px solid var(--border); background: var(--surface2);
    color: var(--muted); font-size: 14px; font-weight: 700;
    cursor: pointer; text-align: center; transition: all 0.15s;
  }
  .verdict-btn:hover { border-color: var(--accent); color: var(--text); }
  .verdict-btn.approved { border-color: var(--green); color: var(--green); background: #1f3a2f; }
  .verdict-btn.blocked  { border-color: var(--red);   color: var(--red);   background: #3a1f1f; }

  @media print {
    header { position: static; }
    .btn-hdr, .sec-chevron { display: none; }
    .section-body { display: block !important; }
    .section { break-inside: avoid; }
  }
</style>
</head>
<body>

<header>
  <h1>⬡ Black-Mata v1 — Field Acceptance Test</h1>

  <button class="btn-hdr" onclick="collapseAll()">Collapse all</button>
  <button class="btn-hdr" onclick="window.print()">Print / PDF</button>
  <button class="btn-hdr danger" onclick="resetAll()">Reset</button>
</header>

<main id="main"></main>

      '[Reproduce cycle] <code>setup_bluetooth_host.sh</code> → reboot → check returns 8 PASS / 0 FAIL',
      '[Reproduce cycle] Proves procedure is REPEATABLE on this unit',
      'x86: <code>bash tools/gamepad/push_gamepad_to_jetson.sh</code> — password prompted once (SSH multiplexing)',
      'All 14 files transferred; no "Is a directory" or permission errors',
    ]
  },
  {
    id: 's17', num: 'SEC 17', title: 'Final State Verification',
    note: 'Clean reboot with auto-start enabled. Verify the robot ships in a known-good state.',
    items: [
      'Dashboard reachable at :8082 without any SSH after reboot',
      'Camera feed live without any SSH',
      '<code>check_bluetooth_host.sh</code> still passes (commissioning survived all testing)',
      '<code>ackermann_config.json</code> has correct calibration values (steer offsets intact)',
      '<code>default_drive_mode</code> in config is <code>"wasd"</code> (shipping default)',
      'No stale BT bonds from test pairings (run a fresh pair to confirm clean state)',
      'Serial monitor shows clean STATE frames — no CRC errors at rest',
      'All widget values make sense: battery healthy, temps at ambient, steer ≈ 0°',
    ]
  },
];

// ─── Render ───────────────────────────────────────────────────────────────────
var STORE_KEY = 'bm_v1_accept_test';

function load() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY) || '{}'); } catch(e) { return {}; }
}

function save(state) {
  localStorage.setItem(STORE_KEY, JSON.stringify(state));
}

var _state = load();
var _meta  = _state._meta || { tester: '', date: '', unit: '', commit: '', verdict: '' };

function itemKey(sId, idx) { return sId + '_' + idx; }

function sectionStatus(sId, count, checked) {
  if (checked === 0)     return { cls: 'todo',    label: 'TODO' };
  if (checked === count) return { cls: 'pass',    label: 'PASS' };
  return                        { cls: 'partial', label: checked + '/' + count };
}

function renderSection(sec) {
  var div = document.createElement('div');
  div.className = 'section';
  div.id = sec.id;

  // Count checked
  var total   = sec.items.length;
  var checked = 0;
  sec.items.forEach(function(_, i) {
    if (_state[itemKey(sec.id, i)]) checked++;
  });

  var st = sectionStatus(sec.id, total, checked);
  var pct = total > 0 ? Math.round(checked / total * 100) : 0;

  div.innerHTML =
    '<div class="section-header" onclick="toggleSection(\'' + sec.id + '\')">' +
      '<span class="sec-num">' + sec.num + '</span>' +
      '<span class="sec-title">' + sec.title + '</span>' +
      '<span class="sec-progress" id="' + sec.id + '-prog">' + checked + ' / ' + total + '</span>' +
      '<span class="sec-status ' + st.cls + '" id="' + sec.id + '-status">' + st.label + '</span>' +
      '<span class="sec-chevron">▶</span>' +
    '</div>' +
    '<div class="sec-bar-wrap"><div class="sec-bar" id="' + sec.id + '-bar" style="width:' + pct + '%"></div></div>' +
    '<div class="section-body" id="' + sec.id + '-body">' +
      (sec.note ? '<div class="sub-note"><code>' + sec.note.replace(/</g,'&lt;').replace(/>/g,'&gt;') + '</code></div>' : '') +
      sec.items.map(function(text, i) {
        var key = itemKey(sec.id, i);
        var chk = _state[key] ? 'checked' : '';
        return '<div class="item' + (chk ? ' checked' : '') + '" id="item-' + key + '">' +
          '<input type="checkbox" id="cb-' + key + '" ' + chk + ' onchange="toggle(\'' + key + '\',\'' + sec.id + '\')">' +
          '<label for="cb-' + key + '">' + text + '</label>' +
        '</div>';
      }).join('') +
    '</div>';

  return div;
}

function renderAll() {
  var main = document.getElementById('main');
  main.innerHTML = '';
  SECTIONS.forEach(function(sec) {
    main.appendChild(renderSection(sec));
  });
  main.appendChild(renderSignoff());
  updateOverall();
}

function toggle(key, sId) {
  var cb = document.getElementById('cb-' + key);
  _state[key] = cb.checked;
  save(_state);
  var row = document.getElementById('item-' + key);
  if (cb.checked) row.classList.add('checked');
  else            row.classList.remove('checked');
  updateSection(sId);
  updateOverall();
  updateSignoffGrid();
}

function updateSection(sId) {
  var sec   = SECTIONS.find(function(s){ return s.id === sId; });
  var total = sec.items.length;
  var checked = 0;
  sec.items.forEach(function(_, i) { if (_state[itemKey(sId, i)]) checked++; });
  var st  = sectionStatus(sId, total, checked);
  var pct = total > 0 ? Math.round(checked / total * 100) : 0;
  document.getElementById(sId + '-prog').textContent   = checked + ' / ' + total;
  document.getElementById(sId + '-status').textContent = st.label;
  document.getElementById(sId + '-status').className   = 'sec-status ' + st.cls;
  document.getElementById(sId + '-bar').style.width    = pct + '%';
}

function updateOverall() {
  var total = 0, checked = 0;
  SECTIONS.forEach(function(sec) {
    total += sec.items.length;
    sec.items.forEach(function(_, i) { if (_state[itemKey(sec.id, i)]) checked++; });
  });
  var pct = total > 0 ? Math.round(checked / total * 100) : 0;
  document.getElementById('overall-bar').style.width = pct + '%';
  document.getElementById('overall-pct').textContent = pct + '%';
  document.getElementById('header-count').textContent = checked + ' / ' + total + ' items';
}

function toggleSection(sId) {
  var sec = document.getElementById(sId);
  sec.classList.toggle('open');
}

function expandAll()   { SECTIONS.forEach(function(s){ document.getElementById(s.id).classList.add('open'); }); }
function collapseAll() { SECTIONS.forEach(function(s){ document.getElementById(s.id).classList.remove('open'); }); }

function resetAll() {
  if (!confirm('Reset ALL checkboxes and sign-off fields? This cannot be undone.')) return;
  localStorage.removeItem(STORE_KEY);
  _state = {};
  _meta  = { tester: '', date: '', unit: '', commit: '', verdict: '' };
  renderAll();
}

// ─── Sign-off ─────────────────────────────────────────────────────────────────
function renderSignoff() {
  var div = document.createElement('div');
  div.className = 'signoff';
  div.id = 'signoff';
  div.innerHTML =
    '<h2>Sign-off</h2>' +
    '<div class="signoff-grid" id="signoff-grid"></div>' +
    '<div class="field-row"><label>Tested by</label><input id="f-tester" placeholder="Name / ID" value="' + (_meta.tester||'') + '" oninput="saveMeta()"></div>' +
    '<div class="field-row"><label>Date</label><input id="f-date" placeholder="YYYY-MM-DD" value="' + (_meta.date||'') + '" oninput="saveMeta()"></div>' +
    '<div class="field-row"><label>Unit / hostname</label><input id="f-unit" placeholder="mata-mata / Jetson hostname" value="' + (_meta.unit||'') + '" oninput="saveMeta()"></div>' +
    '<div class="field-row"><label>Firmware commit</label><input id="f-commit" placeholder="git rev-parse --short HEAD" value="' + (_meta.commit||'') + '" oninput="saveMeta()"></div>' +
    '<div class="verdict">' +
      '<div class="verdict-btn' + (_meta.verdict==='approved'?' approved':'') + '" id="v-approved" onclick="setVerdict(\'approved\')">✓ APPROVED FOR RELEASE</div>' +
      '<div class="verdict-btn' + (_meta.verdict==='blocked'?' blocked':'') + '" id="v-blocked"  onclick="setVerdict(\'blocked\')">✗ BLOCKED — see notes</div>' +
    '</div>';
  return div;
}

function updateSignoffGrid() {
  var grid = document.getElementById('signoff-grid');
  if (!grid) return;
  grid.innerHTML = SECTIONS.map(function(sec) {
    var total = sec.items.length, checked = 0;
    sec.items.forEach(function(_, i) { if (_state[itemKey(sec.id, i)]) checked++; });
    var st = sectionStatus(sec.id, total, checked);
    return '<div class="signoff-row ' + st.cls + '">' +
      '<div class="dot"></div>' +
      '<span class="sec-lbl">' + sec.num + ' — ' + sec.title + '</span>' +
      '<span class="sec-badge">' + (st.cls==='todo'?'—':st.label) + '</span>' +
    '</div>';
  }).join('');
}

function saveMeta() {
  _meta.tester  = document.getElementById('f-tester').value;
  _meta.date    = document.getElementById('f-date').value;
  _meta.unit    = document.getElementById('f-unit').value;
  _meta.commit  = document.getElementById('f-commit').value;
  _state._meta  = _meta;
  save(_state);
}

function setVerdict(v) {
  _meta.verdict = v;
  _state._meta  = _meta;
  save(_state);
  document.getElementById('v-approved').className = 'verdict-btn' + (v==='approved'?' approved':'');
  document.getElementById('v-blocked').className  = 'verdict-btn' + (v==='blocked'?' blocked':'');
}

// ─── Boot ─────────────────────────────────────────────────────────────────────
renderAll();
// Expand first incomplete section automatically
for (var i = 0; i < SECTIONS.length; i++) {
  var sec = SECTIONS[i];
  var total = sec.items.length, checked = 0;
  sec.items.forEach(function(_, j) { if (_state[itemKey(sec.id, j)]) checked++; });
  if (checked < total) {
    document.getElementById(sec.id).classList.add('open');
    break;
  }
}
updateSignoffGrid();
</script>
</body>
</html>
