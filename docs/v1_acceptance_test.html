<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Black-Mata v1 — Acceptance Test</title>
<style>
  :root {
    --bg:       #0d1117;
    --surface:  #161b22;
    --surface2: #1e242d;
    --border:   #30363d;
    --text:     #e6edf3;
    --muted:    #8b949e;
    --accent:   #58a6ff;
    --green:    #3fb950;
    --red:      #f85149;
    --yellow:   #d29922;
    --orange:   #ffa657;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
    font-size: 14px; line-height: 1.6;
  }

  /* ── header ── */
  header {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 16px 24px; position: sticky; top: 0; z-index: 100;
    display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
  }
  header h1 { font-size: 16px; font-weight: 700; color: #fff; white-space: nowrap; }
  .header-meta { font-size: 12px; color: var(--muted); }

  .overall-bar-wrap {
    flex: 1; min-width: 180px;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 6px; height: 18px; overflow: hidden; position: relative;
  }
  .overall-bar {
    height: 100%; width: 0; background: var(--green);
    transition: width 0.3s ease;
  }
  .overall-pct {
    position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; font-size: 11px; font-weight: 700; color: #fff;
  }

  .btn-hdr {
    font-size: 12px; font-weight: 600; padding: 5px 12px; border-radius: 5px;
    cursor: pointer; border: 1px solid var(--border); background: var(--surface2);
    color: var(--text); white-space: nowrap;
  }
  .btn-hdr:hover { border-color: var(--accent); color: var(--accent); }
  .btn-hdr.danger:hover { border-color: var(--red); color: var(--red); }

  /* ── main layout ── */
  main { max-width: 860px; margin: 0 auto; padding: 24px 20px 80px; }

  /* ── section card ── */
  .section {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; margin-bottom: 14px; overflow: hidden;
  }
  .section-header {
    display: flex; align-items: center; gap: 12px;
    padding: 13px 18px; cursor: pointer; user-select: none;
    border-bottom: 1px solid transparent;
    transition: background 0.15s;
  }
  .section-header:hover { background: #ffffff08; }
  .section.open .section-header { border-bottom-color: var(--border); }

  .sec-num {
    font-size: 10px; font-weight: 700; letter-spacing: 0.1em;
    color: var(--muted); background: var(--bg);
    padding: 2px 8px; border-radius: 4px; border: 1px solid var(--border);
    white-space: nowrap;
  }
  .sec-title { font-size: 14px; font-weight: 600; color: var(--text); flex: 1; }
  .sec-progress {
    font-size: 11px; color: var(--muted); white-space: nowrap;
  }
  .sec-status {
    font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 4px;
    white-space: nowrap;
  }
  .sec-status.todo    { background: #1e242d; color: var(--muted); border: 1px solid var(--border); }
  .sec-status.partial { background: #3a2f1f; color: var(--orange); border: 1px solid #5a4a2a; }
  .sec-status.pass    { background: #1f3a2f; color: var(--green);  border: 1px solid #2a5a3a; }
  .sec-status.fail    { background: #3a1f1f; color: var(--red);    border: 1px solid #5a2a2a; }
  .sec-chevron { color: var(--muted); font-size: 11px; transition: transform 0.2s; }
  .section.open .sec-chevron { transform: rotate(90deg); }

  /* ── section progress bar ── */
  .sec-bar-wrap {
    height: 3px; background: var(--bg);
  }
  .sec-bar { height: 100%; width: 0; background: var(--green); transition: width 0.3s ease; }

  /* ── items ── */
  .section-body { padding: 12px 18px 16px; display: none; }
  .section.open .section-body { display: block; }

  .item {
    padding: 5px 0; border-bottom: 1px solid #1a1f26;
  }
  .item:last-child { border-bottom: none; }

  .item-row { display: flex; align-items: flex-start; gap: 10px; }

  /* ── per-row status toggle (✓ / ✗) ── */
  .status-toggle { display: flex; gap: 3px; flex-shrink: 0; margin-top: 1px; }
  .st-btn {
    width: 22px; height: 22px; border-radius: 4px; cursor: pointer; padding: 0;
    border: 1px solid var(--border); background: var(--surface2);
    color: var(--muted); font-size: 12px; font-weight: 700; line-height: 1;
    display: flex; align-items: center; justify-content: center;
  }
  .st-btn:hover { border-color: var(--accent); color: var(--text); }
  .st-btn.st-pass.active { background: #1f3a2f; border-color: #2a5a3a; color: var(--green); }
  .st-btn.st-fail.active { background: #3a1f1f; border-color: #5a2a2a; color: var(--red); }

  .item-label { font-size: 13px; color: var(--text); flex: 1; line-height: 1.5; }
  .item.pass .item-label { color: var(--muted); text-decoration: line-through; }

  .item-label code {
    font-family: 'SFMono-Regular', 'Consolas', monospace;
    font-size: 12px; background: var(--bg);
    padding: 1px 5px; border-radius: 3px; color: var(--accent);
  }
  .item-label .warn { color: var(--yellow); font-style: italic; font-size: 12px; }

  /* ── per-row note ── */
  .note-btn {
    flex-shrink: 0; width: 24px; height: 22px; border-radius: 4px; cursor: pointer;
    border: 1px solid transparent; background: transparent;
    color: var(--muted); font-size: 13px; line-height: 1; margin-top: 1px;
  }
  .note-btn:hover { border-color: var(--border); color: var(--accent); }
  .note-btn.has-note { color: var(--accent); }
  .note-wrap { margin: 6px 0 4px 64px; }
  .note-area {
    width: 100%; min-height: 48px; resize: vertical;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 6px; color: var(--text); padding: 7px 10px;
    font-family: inherit; font-size: 12px; line-height: 1.5;
  }
  .note-area:focus { outline: none; border-color: var(--accent); }
  .item.fail .note-area { border-color: #5a2a2a; }

  /* ── "how to test" expander ── */
  .info-btn {
    flex-shrink: 0; width: 24px; height: 22px; border-radius: 4px; cursor: pointer;
    border: 1px solid transparent; background: transparent;
    color: var(--muted); font-size: 13px; line-height: 1; margin-top: 1px;
  }
  .info-btn:hover { border-color: var(--border); color: var(--accent); }
  .how-wrap {
    font-size: 12px; color: var(--muted); margin: 6px 0 6px 64px;
    padding: 8px 11px; border-left: 2px solid var(--accent);
    border-radius: 0 4px 4px 0; background: var(--surface2); line-height: 1.55;
  }
  .how-wrap strong { color: var(--accent); }
  .how-wrap code {
    font-family: monospace; font-size: 11px; color: var(--orange);
    background: var(--bg); padding: 1px 4px; border-radius: 3px;
  }

  /* ── evidence gating ── */
  .gated-dot { color: var(--yellow); font-size: 9px; vertical-align: middle; margin-right: 5px; }
  .ev-chip {
    display: inline-block; font-size: 10px; font-weight: 700; color: var(--orange);
    background: #3a2f1f; border: 1px solid #5a4a2a; border-radius: 4px;
    padding: 1px 6px; margin-left: 6px; white-space: nowrap;
  }
  .val-row { display: flex; align-items: center; gap: 8px; margin: 6px 0 4px 64px; }
  .val-row label { font-size: 12px; color: var(--muted); }
  .val-input {
    background: var(--surface2); border: 1px solid var(--border); color: var(--text);
    padding: 3px 8px; border-radius: 5px; font-family: monospace; font-size: 12px; width: 140px;
  }
  .val-input:focus { outline: none; border-color: var(--accent); }

  /* ── designer mode ── */
  .d-toolbar {
    background: #2a1f3a; border: 1px solid #4a3a5a; border-radius: 10px;
    padding: 14px 16px; margin-bottom: 16px;
  }
  .d-toolbar-msg { font-size: 12px; color: #d6c5e8; margin-bottom: 10px; line-height: 1.5; }
  .d-toolbar-btns { display: flex; gap: 8px; flex-wrap: wrap; }

  .d-section {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px 16px; margin-bottom: 12px;
  }
  .d-sec-head { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .d-num   { width: 86px; flex-shrink: 0; }
  .d-title { flex: 1; }
  .d-sec-head input, .d-note, .d-item textarea, .d-adv input, .d-adv textarea {
    background: var(--surface2); border: 1px solid var(--border); color: var(--text);
    padding: 6px 9px; border-radius: 5px; font-family: inherit; font-size: 13px;
  }
  .d-sec-head input:focus, .d-note:focus, .d-item textarea:focus,
  .d-adv input:focus, .d-adv textarea:focus { outline: none; border-color: var(--accent); }
  .d-note { width: 100%; font-size: 12px; margin-bottom: 10px; }
  .d-num { font-weight: 700; color: var(--muted); }

  .d-mv, .d-del {
    flex-shrink: 0; width: 28px; height: 28px; border-radius: 5px; cursor: pointer;
    border: 1px solid var(--border); background: var(--surface2); color: var(--muted);
    font-size: 12px; line-height: 1;
  }
  .d-mv:hover  { border-color: var(--accent); color: var(--accent); }
  .d-del:hover { border-color: var(--red);    color: var(--red); }

  .d-items { display: flex; flex-direction: column; gap: 8px; margin: 4px 0 10px; }
  .d-item  { background: var(--bg); border: 1px solid #23292f; border-radius: 7px; padding: 8px; }
  .d-item-main { display: flex; gap: 6px; align-items: flex-start; }
  .d-t { flex: 1; resize: vertical; min-height: 32px; line-height: 1.45; }

  .d-adv {
    margin-top: 8px; padding: 10px; border-radius: 6px;
    background: var(--surface2); border: 1px solid var(--border);
  }
  .d-adv label { display: block; font-size: 11px; color: var(--muted); margin: 6px 0 3px; }
  .d-adv label:first-child { margin-top: 0; }
  .d-adv code { font-family: monospace; color: var(--orange); }
  .d-how { width: 100%; min-height: 56px; resize: vertical; }
  .d-val { width: 220px; }
  .d-check { display: flex !important; align-items: center; gap: 7px; color: var(--text) !important; font-size: 12px !important; }
  .d-check input { width: 14px; height: 14px; accent-color: var(--accent); }

  .d-add, .d-add-sec {
    font-size: 12px; font-weight: 600; padding: 7px 14px; border-radius: 6px;
    cursor: pointer; border: 1px dashed var(--border); background: transparent; color: var(--muted);
  }
  .d-add:hover, .d-add-sec:hover { border-color: var(--accent); color: var(--accent); }
  .d-add-sec { display: block; width: 100%; margin-top: 4px; padding: 11px; border-style: dashed; }

  /* hide tester-only chrome while designing */
  body.design-mode .overall-bar-wrap, body.design-mode .header-meta { visibility: hidden; }

  .sub-note {
    font-size: 12px; color: var(--muted); margin: 6px 0 10px 25px;
    padding: 6px 10px; border-left: 2px solid var(--border);
    border-radius: 0 4px 4px 0; background: var(--surface2);
  }
  .sub-note code { font-family: monospace; font-size: 11px; color: var(--orange); }

  /* ── sign-off ── */
  .signoff {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 20px 22px; margin-top: 24px;
  }
  .signoff h2 { font-size: 15px; font-weight: 700; color: #fff; margin-bottom: 14px; }
  .signoff-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
    margin-bottom: 18px;
  }
  .signoff-row {
    display: flex; align-items: center; gap: 8px; font-size: 12px;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 6px; padding: 7px 12px;
  }
  .signoff-row .dot {
    width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
    background: var(--muted);
  }
  .signoff-row.pass .dot  { background: var(--green); }
  .signoff-row.fail .dot  { background: var(--red); }
  .signoff-row .sec-lbl   { flex: 1; }
  .signoff-row .sec-badge { font-size: 11px; font-weight: 700; }
  .signoff-row.pass .sec-badge { color: var(--green); }
  .signoff-row.fail .sec-badge { color: var(--red); }
  .signoff-row.todo .sec-badge { color: var(--muted); }

  .field-row {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 8px; font-size: 13px;
  }
  .field-row label { width: 180px; color: var(--muted); flex-shrink: 0; }
  .field-row input {
    flex: 1; background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); padding: 5px 10px; border-radius: 5px;
    font-family: monospace; font-size: 12px;
  }
  .field-row input:focus { outline: none; border-color: var(--accent); }

  .verdict {
    display: flex; gap: 12px; margin-top: 14px; flex-wrap: wrap;
  }
  .verdict-btn {
    flex: 1; min-width: 160px; padding: 12px; border-radius: 7px;
    border: 2px solid var(--border); background: var(--surface2);
    color: var(--muted); font-size: 14px; font-weight: 700;
    cursor: pointer; text-align: center; transition: all 0.15s;
  }
  .verdict-btn:hover { border-color: var(--accent); color: var(--text); }
  .verdict-btn.approved { border-color: var(--green); color: var(--green); background: #1f3a2f; }
  .verdict-btn.blocked  { border-color: var(--red);   color: var(--red);   background: #3a1f1f; }

  @media print {
    header { position: static; }
    .btn-hdr, .sec-chevron, .note-btn { display: none; }
    .section-body { display: block !important; }
    .section { break-inside: avoid; }
    .note-wrap:not(.has-content) { display: none !important; }
    .note-wrap.has-content { display: block !important; }
  }
</style>
</head>
<body>

<header>
  <h1>⬡ Black-Mata v1 — Field Acceptance Test</h1>
  <div class="overall-bar-wrap">
    <div class="overall-bar" id="overall-bar"></div>
    <div class="overall-pct" id="overall-pct">0%</div>
  </div>
  <div class="header-meta" id="header-count">0 / 0 items</div>
  <button class="btn-hdr" onclick="expandAll()">Expand all</button>
  <button class="btn-hdr" onclick="collapseAll()">Collapse all</button>
  <button class="btn-hdr" onclick="window.print()">Print / PDF</button>
  <button class="btn-hdr" onclick="exportIssues()">Export issues</button>
  <button class="btn-hdr" id="design-btn" onclick="toggleDesign()">Edit list</button>
  <button class="btn-hdr danger" onclick="resetAll()">Reset</button>
</header>

<main id="main"></main>

// ─── Test definition (coordinator-editable) ────────────────────────────────────
// The DEFINITION (sections/items) is separate from the tester's RESULTS.
// Precedence: locally-edited def  >  embedded def (shipped file)  >  built-in.
var DEF_KEY  = 'bm_v1_def';
var STORE_KEY = 'bm_v1_accept_test';

function clone(o) { return JSON.parse(JSON.stringify(o)); }
function loadDef() {
  try { var d = localStorage.getItem(DEF_KEY); return d ? JSON.parse(d) : null; } catch(e) { return null; }
}
// Collapse {t-only} items back to plain strings so the saved/exported def stays tidy.
function compact(sections) {
  return sections.map(function(sec) {
    var o = { id: sec.id, num: sec.num, title: sec.title };
    if (sec.note) o.note = sec.note;
    o.items = sec.items.map(function(it) {
      var x = normItem(it);
      if (!x.how && !x.ev && !x.val) return x.t;
      var r = { t: x.t };
      if (x.how) r.how = x.how;
      if (x.ev)  r.ev  = true;
      if (x.val) r.val = x.val;
      return r;
    });
    return o;
  });
}
function defSave() { localStorage.setItem(DEF_KEY, JSON.stringify(compact(SECTIONS))); }

var SECTIONS = loadDef()
  || (typeof window !== 'undefined' && window.EMBEDDED_DEF ? clone(window.EMBEDDED_DEF) : clone(BUILTIN_SECTIONS));
var _design = false;        // coordinator "Edit list" mode
var PRISTINE_HTML = '';     // captured at boot for the standalone-HTML export

// ─── Render ───────────────────────────────────────────────────────────────────
function load() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY) || '{}'); } catch(e) { return {}; }
}

function save(state) {
  localStorage.setItem(STORE_KEY, JSON.stringify(state));
}

function downloadFile(content, fname, mime) {
  var blob = new Blob([content], { type: mime });
  var url  = URL.createObjectURL(blob);
  var a    = document.createElement('a');
  a.href = url; a.download = fname;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

var _state = load();
var _meta  = _state._meta || { tester: '', date: '', unit: '', commit: '', verdict: '' };

function itemKey(sId, idx) { return sId + '_' + idx; }
function noteKey(key) { return 'note_' + key; }

// Per-item status: 'pass' | 'fail' | 'todo'. (true kept for backward-compat = pass.)
function itemStatus(key) {
  var v = _state[key];
  if (v === 'pass' || v === true) return 'pass';
  if (v === 'fail') return 'fail';
  return 'todo';
}

function countSection(sec) {
  var pass = 0, fail = 0;
  sec.items.forEach(function(_, i) {
    var s = itemStatus(itemKey(sec.id, i));
    if (s === 'pass') pass++;
    else if (s === 'fail') fail++;
  });
  return { total: sec.items.length, pass: pass, fail: fail };
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function sectionStatus(total, pass, fail) {
  if (fail > 0)       return { cls: 'fail',    label: 'FAIL' };
  if (pass === 0)     return { cls: 'todo',    label: 'TODO' };
  if (pass === total) return { cls: 'pass',    label: 'PASS' };
  return                     { cls: 'partial', label: pass + '/' + total };
}

// Items are plain strings, or objects { t, how, ev, val } for the non-trivial rows:
//   t   — label (required)        how — "how to test" detail (shows ⓘ expander)
//   ev  — evidence-gated flag     val — label for a typed measured-value field (implies gated)
function normItem(item) { return (typeof item === 'string') ? { t: item } : item; }
function isGated(obj)   { return !!(obj.ev || obj.val); }

function rowHasEvidence(key, obj) {
  var note = (_state[noteKey(key)] || '').trim();
  var val  = obj.val ? (_state['val_' + key] || '').trim() : '';
  return note.length > 0 || val.length > 0;
}

function itemObjByKey(key) {
  var us  = key.lastIndexOf('_');
  var sec = SECTIONS.find(function(s){ return s.id === key.slice(0, us); });
  return sec ? normItem(sec.items[parseInt(key.slice(us + 1), 10)]) : null;
}

function renderSection(sec) {
  var div = document.createElement('div');
  div.className = 'section';
  div.id = sec.id;

  var c = countSection(sec);
  var st = sectionStatus(c.total, c.pass, c.fail);
  var pct = c.total > 0 ? Math.round(c.pass / c.total * 100) : 0;

  div.innerHTML =
    '<div class="section-header" onclick="toggleSection(\'' + sec.id + '\')">' +
      '<span class="sec-num">' + sec.num + '</span>' +
      '<span class="sec-title">' + sec.title + '</span>' +
      '<span class="sec-progress" id="' + sec.id + '-prog">' + c.pass + ' / ' + c.total + '</span>' +
      '<span class="sec-status ' + st.cls + '" id="' + sec.id + '-status">' + st.label + '</span>' +
      '<span class="sec-chevron">▶</span>' +
    '</div>' +
    '<div class="sec-bar-wrap"><div class="sec-bar" id="' + sec.id + '-bar" style="width:' + pct + '%"></div></div>' +
    '<div class="section-body" id="' + sec.id + '-body">' +
      (sec.note ? '<div class="sub-note"><code>' + sec.note.replace(/</g,'&lt;').replace(/>/g,'&gt;') + '</code></div>' : '') +
      sec.items.map(function(text, i) { return renderItem(sec.id, text, i); }).join('') +
    '</div>';

  return div;
}

function renderItem(sId, item, i) {
  var obj     = normItem(item);
  var key     = itemKey(sId, i);
  var status  = itemStatus(key);
  var note    = _state[noteKey(key)] || '';
  var hasNote = note.trim().length > 0;
  var gated   = isGated(obj);
  var evMissing = gated && status === 'pass' && !rowHasEvidence(key, obj);

  var infoBtn = obj.how
    ? '<button class="info-btn" title="How to test" onclick="toggleHow(\'' + key + '\')">ⓘ</button>' : '';
  var howBlock = obj.how
    ? '<div class="how-wrap" id="how-' + key + '" style="display:none"><strong>How to test:</strong> ' + obj.how + '</div>' : '';
  var valField = obj.val
    ? '<div class="val-row"><label>' + esc(obj.val) + '</label>' +
      '<input class="val-input" id="val-' + key + '" value="' + esc(_state['val_' + key] || '') + '" oninput="saveVal(\'' + key + '\')"></div>' : '';
  var gatedDot = gated ? '<span class="gated-dot" title="Evidence expected on PASS">●</span>' : '';
  var evChip   = '<span class="ev-chip" id="evchip-' + key + '"' + (evMissing ? '' : ' style="display:none"') + '>evidence missing</span>';

  return '<div class="item ' + status + (gated ? ' gated' : '') + '" id="item-' + key + '">' +
    '<div class="item-row">' +
      '<div class="status-toggle">' +
        '<button class="st-btn st-pass' + (status==='pass'?' active':'') + '" title="Pass" onclick="setStatus(\'' + key + '\',\'' + sId + '\',\'pass\')">✓</button>' +
        '<button class="st-btn st-fail' + (status==='fail'?' active':'') + '" title="Fail" onclick="setStatus(\'' + key + '\',\'' + sId + '\',\'fail\')">✗</button>' +
      '</div>' +
      '<span class="item-label">' + gatedDot + obj.t + evChip + '</span>' +
      infoBtn +
      '<button class="note-btn' + (hasNote?' has-note':'') + '" id="notebtn-' + key + '" title="Add note / evidence" onclick="toggleNote(\'' + key + '\')">✎</button>' +
    '</div>' +
    howBlock +
    valField +
    '<div class="note-wrap' + (hasNote?' has-content':'') + '" id="note-' + key + '" style="display:' + (hasNote?'block':'none') + '">' +
      '<textarea class="note-area" id="noteta-' + key + '" placeholder="Notes / evidence — observed value, serial output, screenshot filename…" oninput="saveNote(\'' + key + '\')">' + esc(note) + '</textarea>' +
    '</div>' +
  '</div>';
}

function renderAll() {
  var main = document.getElementById('main');
  main.innerHTML = '';
  if (_design) { main.innerHTML = renderDesign(); return; }
  SECTIONS.forEach(function(sec) {
    main.appendChild(renderSection(sec));
  });
  main.appendChild(renderSignoff());
  updateOverall();
}

function setStatus(key, sId, status) {
  var cur  = itemStatus(key);
  var next = (cur === status) ? 'todo' : status;   // click active button again to clear
  if (next === 'todo') delete _state[key];
  else                 _state[key] = next;
  save(_state);

  var row = document.getElementById('item-' + key);
  row.className = 'item ' + next;
  row.querySelector('.st-pass').classList.toggle('active', next === 'pass');
  row.querySelector('.st-fail').classList.toggle('active', next === 'fail');

  if (next === 'fail') {                            // failing a row → open its note
    var wrap = document.getElementById('note-' + key);
    wrap.style.display = 'block';
    document.getElementById('noteta-' + key).focus();
  }
  updateEvidenceFlag(key);
  updateSection(sId);
  updateOverall();
  updateSignoffGrid();
}

function toggleNote(key) {
  var wrap = document.getElementById('note-' + key);
  var show = (wrap.style.display === 'none' || !wrap.style.display);
  wrap.style.display = show ? 'block' : 'none';
  if (show) document.getElementById('noteta-' + key).focus();
}

function toggleHow(key) {
  var w = document.getElementById('how-' + key);
  w.style.display = (w.style.display === 'none' || !w.style.display) ? 'block' : 'none';
}

function saveNote(key) {
  var val = document.getElementById('noteta-' + key).value;
  var has = val.trim().length > 0;
  if (has) _state[noteKey(key)] = val;
  else     delete _state[noteKey(key)];
  save(_state);
  document.getElementById('notebtn-' + key).classList.toggle('has-note', has);
  document.getElementById('note-' + key).classList.toggle('has-content', has);
  updateEvidenceFlag(key);
}

function saveVal(key) {
  var v = document.getElementById('val-' + key).value;
  if (v.trim().length) _state['val_' + key] = v;
  else                 delete _state['val_' + key];
  save(_state);
  updateEvidenceFlag(key);
}

// Show/hide the amber "evidence missing" chip (flag-only — never blocks).
function updateEvidenceFlag(key) {
  var chip = document.getElementById('evchip-' + key);
  if (!chip) return;
  var obj = itemObjByKey(key);
  var show = obj && isGated(obj) && itemStatus(key) === 'pass' && !rowHasEvidence(key, obj);
  chip.style.display = show ? '' : 'none';
}

function updateSection(sId) {
  var sec = SECTIONS.find(function(s){ return s.id === sId; });
  var c   = countSection(sec);
  var st  = sectionStatus(c.total, c.pass, c.fail);
  var pct = c.total > 0 ? Math.round(c.pass / c.total * 100) : 0;
  document.getElementById(sId + '-prog').textContent   = c.pass + ' / ' + c.total;
  document.getElementById(sId + '-status').textContent = st.label;
  document.getElementById(sId + '-status').className   = 'sec-status ' + st.cls;
  document.getElementById(sId + '-bar').style.width    = pct + '%';
}

function updateOverall() {
  var total = 0, pass = 0, fail = 0;
  SECTIONS.forEach(function(sec) {
    var c = countSection(sec);
    total += c.total; pass += c.pass; fail += c.fail;
  });
  var pct = total > 0 ? Math.round(pass / total * 100) : 0;
  document.getElementById('overall-bar').style.width = pct + '%';
  document.getElementById('overall-pct').textContent = pct + '%';
  document.getElementById('header-count').textContent =
    pass + ' / ' + total + ' passed' + (fail > 0 ? ' · ' + fail + ' failed' : '');
}

function toggleSection(sId) {
  var sec = document.getElementById(sId);
  sec.classList.toggle('open');
}

function expandAll()   { SECTIONS.forEach(function(s){ document.getElementById(s.id).classList.add('open'); }); }
function collapseAll() { SECTIONS.forEach(function(s){ document.getElementById(s.id).classList.remove('open'); }); }

function resetAll() {
  if (!confirm('Reset ALL pass/fail marks, notes, and sign-off fields? This cannot be undone.')) return;
  localStorage.removeItem(STORE_KEY);
  _state = {};
  _meta  = { tester: '', date: '', unit: '', commit: '', verdict: '' };
  renderAll();
}

// ─── Sign-off ─────────────────────────────────────────────────────────────────
function renderSignoff() {
  var div = document.createElement('div');
  div.className = 'signoff';
  div.id = 'signoff';
  div.innerHTML =
    '<h2>Sign-off</h2>' +
    '<div class="signoff-grid" id="signoff-grid"></div>' +
    '<div class="field-row"><label>Tested by</label><input id="f-tester" placeholder="Name / ID" value="' + (_meta.tester||'') + '" oninput="saveMeta()"></div>' +
    '<div class="field-row"><label>Date</label><input id="f-date" placeholder="YYYY-MM-DD" value="' + (_meta.date||'') + '" oninput="saveMeta()"></div>' +
    '<div class="field-row"><label>Unit / hostname</label><input id="f-unit" placeholder="mata-mata / Jetson hostname" value="' + (_meta.unit||'') + '" oninput="saveMeta()"></div>' +
    '<div class="field-row"><label>Firmware commit</label><input id="f-commit" placeholder="git rev-parse --short HEAD" value="' + (_meta.commit||'') + '" oninput="saveMeta()"></div>' +
    '<div class="verdict">' +
      '<div class="verdict-btn' + (_meta.verdict==='approved'?' approved':'') + '" id="v-approved" onclick="setVerdict(\'approved\')">✓ APPROVED FOR RELEASE</div>' +
      '<div class="verdict-btn' + (_meta.verdict==='blocked'?' blocked':'') + '" id="v-blocked"  onclick="setVerdict(\'blocked\')">✗ BLOCKED — see notes</div>' +
    '</div>';
  return div;
}

function updateSignoffGrid() {
  var grid = document.getElementById('signoff-grid');
  if (!grid) return;
  grid.innerHTML = SECTIONS.map(function(sec) {
    var c = countSection(sec);
    var st = sectionStatus(c.total, c.pass, c.fail);
    return '<div class="signoff-row ' + st.cls + '">' +
      '<div class="dot"></div>' +
      '<span class="sec-lbl">' + sec.num + ' — ' + sec.title + '</span>' +
      '<span class="sec-badge">' + (st.cls==='todo'?'—':st.label) + '</span>' +
    '</div>';
  }).join('');
}

function saveMeta() {
  _meta.tester  = document.getElementById('f-tester').value;
  _meta.date    = document.getElementById('f-date').value;
  _meta.unit    = document.getElementById('f-unit').value;
  _meta.commit  = document.getElementById('f-commit').value;
  _state._meta  = _meta;
  save(_state);
}

function setVerdict(v) {
  _meta.verdict = v;
  _state._meta  = _meta;
  save(_state);
  document.getElementById('v-approved').className = 'verdict-btn' + (v==='approved'?' approved':'');
  document.getElementById('v-blocked').className  = 'verdict-btn' + (v==='blocked'?' blocked':'');
}

// ─── Export issue report ───────────────────────────────────────────────────────
function stripHtml(s) {
  var d = document.createElement('div');
  d.innerHTML = s;
  return (d.textContent || d.innerText || '').replace(/\s+/g, ' ').trim();
}

function exportIssues() {
  saveMeta();                                       // capture latest sign-off fields
  var L = [];
  L.push('# Black-Mata v1 Acceptance — Issue Report', '');
  L.push('- Unit / hostname: '  + (_meta.unit   || '—'));
  L.push('- Tested by: '        + (_meta.tester || '—'));
  L.push('- Date: '             + (_meta.date   || '—'));
  L.push('- Firmware commit: '  + (_meta.commit || '—'));
  L.push('- Verdict: '          + (_meta.verdict ? _meta.verdict.toUpperCase() : '—'));

  var total = 0, pass = 0, fail = 0;
  var fails = [], notes = [], values = [], gaps = [];
  SECTIONS.forEach(function(sec) {
    var secFail = [], secNote = [], secVal = [], secGap = [];
    sec.items.forEach(function(item, i) {
      var obj  = normItem(item);
      var key  = itemKey(sec.id, i);
      var st   = itemStatus(key);
      total++;
      if (st === 'pass') pass++; else if (st === 'fail') fail++;
      var note  = (_state[noteKey(key)] || '').trim();
      var val   = obj.val ? (_state['val_' + key] || '').trim() : '';
      var label = stripHtml(obj.t);
      if (st === 'fail')
        secFail.push('- ' + label + (note ? '\n      Note: ' + note.replace(/\n/g, '\n      ') : ''));
      else if (note)
        secNote.push('- [' + st.toUpperCase() + '] ' + label + '\n      Note: ' + note.replace(/\n/g, '\n      '));
      if (obj.val)
        secVal.push('- ' + obj.val + ': ' + (val || '—') + '   (' + label + ')');
      if (isGated(obj) && st === 'pass' && !rowHasEvidence(key, obj))
        secGap.push('- ' + label);
    });
    function emit(arr, target) {
      if (arr.length) { target.push('### ' + sec.num + ' — ' + sec.title); target.push.apply(target, arr); target.push(''); }
    }
    emit(secFail, fails); emit(secNote, notes); emit(secVal, values); emit(secGap, gaps);
  });

  L.push('- Summary: ' + pass + ' passed, ' + fail + ' failed, ' + (total-pass-fail) + ' not tested (of ' + total + ')');
  if (gaps.length) L.push('- ⚠ ' + gaps.length + ' gated PASS row(s) missing evidence');
  L.push('');

  L.push('## Failures', '');
  if (fails.length) L.push.apply(L, fails);
  else              L.push('_No failures recorded._', '');

  if (values.length) { L.push('## Measured values', ''); L.push.apply(L, values); }
  if (gaps.length)   { L.push('## Evidence gaps (gated PASS without value/note)', ''); L.push.apply(L, gaps); L.push(''); }
  if (notes.length)  { L.push('## Other notes', ''); L.push.apply(L, notes); }

  var md = L.join('\n');
  var safeUnit = (_meta.unit || 'unit').replace(/[^a-z0-9_-]+/gi, '');
  var fname = 'black-mata-acceptance-' + safeUnit + '-' + (_meta.date || new Date().toISOString().slice(0,10)) + '.md';

  var blob = new Blob([md], { type: 'text/markdown' });
  var url  = URL.createObjectURL(blob);
  var a    = document.createElement('a');
  a.href = url; a.download = fname;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(md).catch(function(){});  // best-effort clipboard copy
  }
}

// ─── Designer mode (coordinator edits the definition) ──────────────────────────
function escAttr(s) { return esc(s).replace(/"/g, '&quot;'); }

function toggleDesign() {
  _design = !_design;
  document.body.classList.toggle('design-mode', _design);
  document.getElementById('design-btn').textContent = _design ? 'Done editing' : 'Edit list';
  renderAll();
  if (!_design) updateSignoffGrid();
}

function renderDesign() {
  var html =
    '<div class="d-toolbar">' +
      '<div class="d-toolbar-msg">✎ Designer mode — editing the TEST DEFINITION (not results). Saved locally as you type. Finalise the list, then "Export standalone HTML" to hand a ready-to-use file to testers.</div>' +
      '<div class="d-toolbar-btns">' +
        '<button class="btn-hdr" onclick="exportStandalone()">Export standalone HTML</button>' +
        '<button class="btn-hdr" onclick="exportDef()">Export definition (JSON)</button>' +
        '<button class="btn-hdr" onclick="importDefPrompt()">Import definition</button>' +
        '<button class="btn-hdr danger" onclick="revertBuiltin()">Revert to built-in</button>' +
      '</div>' +
    '</div>';

  SECTIONS.forEach(function(sec, si) {
    html +=
      '<div class="d-section">' +
        '<div class="d-sec-head">' +
          '<input class="d-num" value="' + escAttr(sec.num) + '" oninput="secField(' + si + ',\'num\',this.value)">' +
          '<input class="d-title" value="' + escAttr(sec.title) + '" oninput="secField(' + si + ',\'title\',this.value)">' +
          '<button class="d-mv" title="Move section up" onclick="secMove(' + si + ',-1)">↑</button>' +
          '<button class="d-mv" title="Move section down" onclick="secMove(' + si + ',1)">↓</button>' +
          '<button class="d-del" title="Delete section" onclick="secDelete(' + si + ')">🗑</button>' +
        '</div>' +
        '<input class="d-note" placeholder="section note / setup hint (optional)" value="' + escAttr(sec.note || '') + '" oninput="secField(' + si + ',\'note\',this.value)">' +
        '<div class="d-items">' +
          sec.items.map(function(it, ii) { return itemEditor(si, ii, normItem(it)); }).join('') +
        '</div>' +
        '<button class="d-add" onclick="itemAdd(' + si + ')">+ Add row</button>' +
      '</div>';
  });

  html += '<button class="d-add-sec" onclick="secAdd()">+ Add section</button>';
  return html;
}

function itemEditor(si, ii, obj) {
  var gated = isGated(obj);
  return '<div class="d-item">' +
    '<div class="d-item-main">' +
      (gated ? '<span class="gated-dot" title="Evidence-gated">●</span>' : '<span class="gated-dot" style="visibility:hidden">●</span>') +
      '<textarea class="d-t" rows="1" oninput="itemField(' + si + ',' + ii + ',\'t\',this.value)">' + esc(obj.t) + '</textarea>' +
      '<button class="d-mv" title="Advanced: how / evidence / value" onclick="advToggle(' + si + ',' + ii + ')">⚙</button>' +
      '<button class="d-mv" title="Move row up" onclick="itemMove(' + si + ',' + ii + ',-1)">↑</button>' +
      '<button class="d-mv" title="Move row down" onclick="itemMove(' + si + ',' + ii + ',1)">↓</button>' +
      '<button class="d-del" title="Delete row" onclick="itemDelete(' + si + ',' + ii + ')">🗑</button>' +
    '</div>' +
    '<div class="d-adv" id="adv-' + si + '-' + ii + '" style="display:none">' +
      '<label>How to test (shows the ⓘ expander to testers — HTML/<code>code</code> allowed)</label>' +
      '<textarea class="d-how" oninput="itemField(' + si + ',' + ii + ',\'how\',this.value)">' + esc(obj.how || '') + '</textarea>' +
      '<label class="d-check"><input type="checkbox" ' + (obj.ev ? 'checked' : '') + ' onchange="itemEv(' + si + ',' + ii + ',this.checked)"> Evidence required on PASS (amber flag if missing)</label>' +
      '<label>Measured-value field label (e.g. "Battery (V)") — blank for none</label>' +
      '<input class="d-val" value="' + escAttr(obj.val || '') + '" oninput="itemField(' + si + ',' + ii + ',\'val\',this.value)">' +
    '</div>' +
  '</div>';
}

function secField(si, f, v) {
  if (f === 'note' && !v) delete SECTIONS[si][f];
  else SECTIONS[si][f] = v;
  defSave();
}
function itemField(si, ii, f, v) {
  var obj = normItem(SECTIONS[si].items[ii]);
  if ((f === 'how' || f === 'val') && !v) delete obj[f];
  else obj[f] = v;
  SECTIONS[si].items[ii] = obj;
  defSave();
}
function itemEv(si, ii, checked) {
  var obj = normItem(SECTIONS[si].items[ii]);
  if (checked) obj.ev = true; else delete obj.ev;
  SECTIONS[si].items[ii] = obj;
  defSave();
  // gated-dot refreshes on next full render; don't re-render here or the open panel collapses
}
function advToggle(si, ii) {
  var e = document.getElementById('adv-' + si + '-' + ii);
  e.style.display = (e.style.display === 'none' || !e.style.display) ? 'block' : 'none';
}
function secMove(si, dir) {
  var j = si + dir; if (j < 0 || j >= SECTIONS.length) return;
  var t = SECTIONS[si]; SECTIONS[si] = SECTIONS[j]; SECTIONS[j] = t;
  defSave(); renderAll();
}
function secDelete(si) {
  if (!confirm('Delete section "' + SECTIONS[si].num + ' — ' + SECTIONS[si].title + '" and all its rows?')) return;
  SECTIONS.splice(si, 1); defSave(); renderAll();
}
function secAdd() {
  SECTIONS.push({ id: 's' + Date.now(), num: 'SEC ' + SECTIONS.length, title: 'New section', items: ['New check'] });
  defSave(); renderAll();
}
function itemAdd(si)        { SECTIONS[si].items.push('New check'); defSave(); renderAll(); }
function itemDelete(si, ii) { SECTIONS[si].items.splice(ii, 1); defSave(); renderAll(); }
function itemMove(si, ii, dir) {
  var arr = SECTIONS[si].items, j = ii + dir; if (j < 0 || j >= arr.length) return;
  var t = arr[ii]; arr[ii] = arr[j]; arr[j] = t;
  defSave(); renderAll();
}

function exportDef() {
  downloadFile(JSON.stringify(compact(SECTIONS), null, 2), 'v1_acceptance_def.json', 'application/json');
}
function importDefPrompt() {
  var inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = function() {
    var f = inp.files[0]; if (!f) return;
    var r = new FileReader();
    r.onload = function() {
      try {
        var def = JSON.parse(r.result);
        if (!Array.isArray(def)) throw new Error('JSON root is not a list of sections');
        if (!confirm('Replace the current list with the imported definition?\n\nTester results are kept but may not line up with the new rows — Reset is recommended after importing.')) return;
        SECTIONS = def; defSave(); renderAll();
      } catch (e) { alert('Import failed: ' + e.message); }
    };
    r.readAsText(f);
  };
  inp.click();
}
function revertBuiltin() {
  if (!confirm('Discard your edits and revert to the built-in list?')) return;
  localStorage.removeItem(DEF_KEY);
  SECTIONS = clone(BUILTIN_SECTIONS);
  renderAll();
}
function exportStandalone() {
  // strip any previously-embedded def back to a bare anchor, then inject the current one
  var base   = PRISTINE_HTML.replace(/<!--DEF_START-->[\s\S]*?<!--DEF_END-->/, '<!--DEF_ANCHOR-->');
  var json   = JSON.stringify(compact(SECTIONS)).replace(/<\//g, '<\\/');
  var inject  = '<!--DEF_START--><script>window.EMBEDDED_DEF=' + json + ';<\/script><!--DEF_END-->';
  downloadFile(base.replace('<!--DEF_ANCHOR-->', inject), 'v1_acceptance_test.html', 'text/html');
}

// ─── Boot ─────────────────────────────────────────────────────────────────────
PRISTINE_HTML = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
renderAll();
// Expand first incomplete section automatically
if (!_design) {
  for (var i = 0; i < SECTIONS.length; i++) {
    var c = countSection(SECTIONS[i]);
    if (c.pass < c.total) {
      document.getElementById(SECTIONS[i].id).classList.add('open');
      break;
    }
  }
}
updateSignoffGrid();
</script>
</body>
</html>
